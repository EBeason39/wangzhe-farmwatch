; 王者农场助手 · FarmWatch
; 将此文件复制为 settings.ini；修改后重启生效。编码：UTF-8。
; 优先级：FARMWATCH_* 环境变量 > settings.ini > 内置默认值。
; 每行只填写一个值；说明请另起一行以分号开头，不要写行尾注释。
; settings.ini 可能含私人令牌，不应上传仓库或放入分享包。

[mumu]
; auto：按实例名自动开关 MuMu；manual：你自行开关，必须填写 device。
mode = auto
; 实例名须与 MuMu 多开器一致，默认 farm，不能重名。FARMWATCH_MUMU_NAME 可覆盖。
instance = farm
; MuMu CLI 的 .exe 绝对路径。留空自动查找；例如 D:\Program Files\NetEase\MuMu\nx_main\mumu-cli.exe。
cli =
; ADB 的 .exe 绝对路径。留空优先使用 MuMu 随附 ADB，其次 platform-tools 和 PATH。
adb =
; manual 模式填写实际 ADB 序列号，例如 127.0.0.1:16416；auto 模式通常留空。
; FARMWATCH_DEVICE 非空时默认切为手动管理；显式 FARMWATCH_MANAGE_MUMU 可覆盖管理开关。
device =

[farm]
; 提前启动模拟器的分钟数，整数 >= 0；默认 5。真正点击前仍会补等到目标时刻。
wake_ahead_min = 5
; 收获目标额外延后的秒数，整数 >= 0；默认 60，避免点击早于游戏成熟时间。
harvest_delay_sec = 60

[updates]
; true：检测并等待游戏资源更新；false：跳过自动更新检测，需自行处理更新。
enabled = true
; 最长等待更新的分钟数，整数 >= 1，默认 180。
timeout_min = 180
; 更新状态轮询间隔，秒数 >= 2，可填小数，默认 15。
poll_sec = 15

[friends]
; true：自家务农成功后检查置顶可拿取好友；false：仅处理自家农场。
; 保留现有规则、24 地块路线、每日额度及北京时间 00:00–08:00 禁用限制。
; 默认 true。使用置顶好友筛选、逐地块确认及游戏反馈校验。
enabled = true

[notify]
; 总开关：true 开启，false 关闭。无凭据时跳过通知，不影响务农。
enabled = true
; wxpusher 或 serverchan；只使用指定通道，不会自动切换备用通道。
channel = wxpusher
; WxPusher SPT 令牌；可留空并改用 FARMWATCH_WXPUSHER_SPT 环境变量。
spt =
; Server酱 SendKey；可留空并改用 FARMWATCH_SC_SENDKEY 环境变量。
sendkey =
; 每日最多通知次数，整数 >= 0；默认 100，0 表示不限。以本机日期计数。
daily_limit = 100

[screenshots]
; false（默认）：不保存历史截图和登录诊断图片，仍保留识别必需的最新工作截图。
; true：启用归档，按下面的 mode 和 retention_hours 保存并清理。
enabled = false
; key：仅农场入口、收获和失败证据；all：归档所有取图。默认 key。
mode = key
; 保留小时数，必须 > 0，可填小数，例如 0.5、24、72、168；默认 72。
; 同时覆盖截图和登录诊断；启动时及每 10 分钟清理一次，只清理本工具的归档。
retention_hours = 72

[logging]
; DEBUG 显示识别细节；INFO 显示步骤；WARNING/ERROR 只保留相应级别。默认 INFO。
level = INFO
; 日志按天轮转，保留天数为整数 >= 1，默认 14；与截图保留时长独立。
retention_days = 14
